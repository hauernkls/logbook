<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Set Logbook</title>
<meta name="theme-color" content="#f3f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101317" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Logbook">
<script>try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
/* Layout: one narrow column, thumb-first. Current session on top, history and the .md file below.
   System fonts only, so the app looks right with no network. Accent borrowed from a 20 kg plate. */
:root {
  --bg: #f3f5f7; --surface: #ffffff; --ink: #16191d; --muted: #5d6670; --line: #d9dee4;
  --accent: #1d5bbf; --accent-ink: #ffffff; --danger: #b3261e; --ok: #2e7d4f; --warn: #9a5b00;
  --display: "Avenir Next Condensed", "Arial Narrow", sans-serif;
  --body: -apple-system, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
/* Dark follows the phone unless the header toggle picked a theme (data-theme on <html>). */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101317; --surface: #191d22; --ink: #e9ecef; --muted: #98a2ad; --line: #2b3138;
    --accent: #5b93ec; --accent-ink: #0b1220; --danger: #ef7b72; --ok: #6cc592; --warn: #e5a54b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101317; --surface: #191d22; --ink: #e9ecef; --muted: #98a2ad; --line: #2b3138;
  --accent: #5b93ec; --accent-ink: #0b1220; --danger: #ef7b72; --ok: #6cc592; --warn: #e5a54b;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: calc(16px + env(safe-area-inset-top, 0px));
  padding-bottom: calc(48px + env(safe-area-inset-bottom, 0px));
  -webkit-tap-highlight-color: transparent;
}
main { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
header { display: flex; align-items: end; justify-content: space-between; gap: 12px; }
h1, h2 { font-family: var(--display); font-weight: 700; text-transform: uppercase; letter-spacing: .02em; margin: 0; }
h1 { font-size: 2.2rem; line-height: 1; }
h2 { font-size: 1.35rem; }
.label { font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
section { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.spread { justify-content: space-between; }

button {
  font: 600 .95rem var(--body); border-radius: 8px; border: 1px solid var(--line); background: var(--surface);
  color: var(--ink); padding: 10px 14px; min-height: 44px; cursor: pointer;
}
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
button.ghost { background: transparent; border-color: transparent; color: var(--muted); padding: 8px 10px; }
button.danger { color: var(--danger); }
button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input, select {
  font: 1rem var(--body); color: var(--ink); background: var(--bg); border: 1px solid var(--line);
  border-radius: 8px; padding: 10px; min-height: 44px; width: 100%; min-width: 0;
}
input::placeholder { color: var(--muted); opacity: .6; }
.num { font-family: var(--mono); text-align: center; font-variant-numeric: tabular-nums; }

.unit { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.unit button { border: 0; border-radius: 0; min-height: 36px; padding: 6px 12px; font-family: var(--mono); }
.theme { min-height: 36px; padding: 6px 10px; font-size: 1rem; line-height: 1; }
.unit button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 16px; }
.meta { display: grid; grid-template-columns: 9.5rem 1fr; gap: 8px; }
.empty { color: var(--muted); display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
.ex { border-top: 1px solid var(--line); padding-top: 14px; display: flex; flex-direction: column; gap: 8px; }
.ex-name { font-family: var(--display); font-size: 1.3rem; font-weight: 600; text-transform: uppercase; letter-spacing: .02em; }
.last { font: .8rem/1.4 var(--mono); color: var(--muted); }
.last b { font-weight: 500; color: var(--ink); }
.sets { display: grid; grid-template-columns: 1.6rem 1fr 1fr 1fr 2.2rem; gap: 6px; align-items: center; }
.sets .label { text-align: center; }
.set-no { font-family: var(--mono); color: var(--muted); text-align: center; }
.add-ex { display: grid; grid-template-columns: 1fr auto; gap: 8px; }

.history { display: flex; flex-direction: column; gap: 8px; }
details { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
summary { list-style: none; cursor: pointer; padding: 12px 14px; display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
summary::-webkit-details-marker { display: none; }
summary .d { font-family: var(--mono); font-size: .85rem; color: var(--muted); white-space: nowrap; }
summary .t { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.detail { padding: 0 14px 14px; display: flex; flex-direction: column; gap: 10px; }
pre { margin: 0; font: .85rem/1.5 var(--mono); background: var(--bg); border-radius: 8px; padding: 12px; white-space: pre-wrap; overflow-wrap: anywhere; -webkit-user-select: text; user-select: text; }
.note { font-size: .85rem; color: var(--muted); margin: 0; }

.file-name { font-family: var(--mono); font-weight: 500; }
.sync { font-size: .85rem; font-weight: 600; }
.sync.ok { color: var(--ok); }
.sync.warn { color: var(--warn); }
.pill { font: 600 .75rem var(--body); color: var(--warn); border: 1px solid currentColor; border-radius: 999px; padding: 2px 8px; background: transparent; min-height: 0; }
.choice { border: 1px solid var(--accent); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-size: .9rem; max-width: calc(100% - 32px); }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <div class="label">Sets · Weight · Reps · RPE</div>
      <h1>Set Logbook</h1>
    </div>
    <div class="row">
      <button id="theme" type="button" class="theme" aria-label="Switch to dark mode">☾</button>
      <div class="unit" role="group" aria-label="Weight unit">
        <button id="unit-kg" type="button" aria-pressed="true">kg</button>
        <button id="unit-lb" type="button" aria-pressed="false">lb</button>
      </div>
    </div>
  </header>

  <section aria-labelledby="cur-h">
    <div class="row spread"><h2 id="cur-h">Today</h2><button id="unsaved-pill" type="button" class="pill" hidden>Not exported</button></div>
    <div id="session" class="card"></div>
  </section>

  <section aria-labelledby="hist-h">
    <div class="row spread"><h2 id="hist-h">History</h2><span id="hist-count" class="label"></span></div>
    <div id="history" class="history"></div>
  </section>

  <section aria-labelledby="file-h">
    <h2 id="file-h">Your .md file</h2>
    <div class="card">
      <div class="row spread"><span class="file-name">training-log.md</span><span id="sync" class="sync"></span></div>
      <p class="note">Your log is stored in this app on your phone. <b>Export</b> saves it as a markdown file, for example to Files or iCloud Drive. <b>Open</b> loads a .md file back in, to restore a backup or move to a new phone.</p>
      <div id="import-choice" class="choice" hidden></div>
      <div class="row">
        <button id="export" type="button" class="primary">Export .md</button>
        <button id="open" type="button">Open .md</button>
        <button id="copy-all" type="button" class="ghost">Copy text</button>
      </div>
      <input id="file-input" type="file" accept=".md,.markdown,.txt,text/markdown,text/plain" hidden>
    </div>
  </section>
</main>
<datalist id="ex-names"></datalist>
<div id="toast" class="toast" role="status" hidden></div>
<script src="md.js"></script>
<script src="app.js"></script>
</body>
</html>
